source = colors.conf

# BACKGROUND
background {
    path = $image
    blur_passes = 4
    blur_size = 7
    noise = 1e-2
    contrast = 0.9
    brightness = 0.5
    vibrancy = 0.17
    vibrancy_darkness = 0
    color = $background
}

# GENERAL
general {
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 40
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $primary_fixed_dim
    inner_color = $primary
    font_color = $surface_container_low
    fade_on_empty = true
    placeholder_text = Enter password...
    hide_input = false
    position = 0, 150
    halign = center
    valign = bottom
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = $primary
    font_family = JetBrainsMono Nerd Font Bold
    font_size = 180
    position = 0, 150
    halign = center
    valign = center
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = $on_surface
    font_family = JetBrainsMono Nerd Font Bold
    font_size = 180
    position = 0, -75
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%a, %b %d")"
    color = $on_surface
    font_family = MS Gothic
    position = 100, -100
    halign = left
    valign = top
}

label {
    monitor = 
    text = Welcome back, $USER
    font_family = MS Gothic Bold
    position = 0, 110
    halign = center
    valign = bottom
  }
auth {
   pam:module = hyprlock-nofp
   pam:enabled = true

}
