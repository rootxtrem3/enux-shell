general {
    # hypridle 0.1.8 has no special `lock` on-timeout keyword (feeding it one
    # makes it reject the whole rule with "No rules configured"), so lock_cmd is
    # never invoked. Both lock paths below spell out hyprlock instead.
    #
    # loginctl lock-session is deliberately not used: this session has no
    # IdleAction set, so it dispatches to nothing and the screen never locks.
    before_sleep_cmd = pidof hyprlock || hyprlock   # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on      # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.

    # ignore_inhibit is a per-listener option in hypridle 0.1.8, not a general
    # one, and false is the default. It is spelled out because it is load-bearing:
    # the shell's dashboard "Idle" button takes out a systemd
    # `systemd-inhibit --what=idle` lock, and these rules only stand down for
    # inhibitors while this is false.
    ignore_inhibit = false
}

# No keyboard-backlight listener: this machine has no rgb:kbd_backlight device
# (brightnessctl -l lists only intel_backlight), so the rule could only ever
# fail. Re-add it if the hardware ever gains one.

listener {
    timeout = 180                                # 3min.
    on-timeout = pidof hyprlock || hyprlock      # lock screen when timeout has passed
    ignore_inhibit = false
}

listener {
    timeout = 330                                # 5.5min
    on-timeout = hyprctl dispatch dpms off       # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && brightnessctl -r   # screen on when activity is detected after timeout has fired.
    ignore_inhibit = false
}

listener {
    timeout = 900                                # 15min
    on-timeout = systemctl suspend               # suspend pc
    ignore_inhibit = false
}
