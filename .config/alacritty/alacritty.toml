[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 10

[window]
opacity = 0.8
padding = { x = 12, y = 12 }

[cursor]
style = "Block"

[colors]
primary = { foreground = "#eedfe2", background = "#191114" }
selection = { text = "#412a33", background = "#e1bdca" }
normal = { black = "#4c4c4c", red = "#ac8a8c", green = "#8aac8b", yellow = "#aca98a", blue = "#ffb0d1", magenta = "#ac8aac", cyan = "#8aacab", white = "#f0f0f0" }
bright = { black = "#262626", red = "#c49ea0", green = "#9ec49f", yellow = "#c4c19e", blue = "#a39ec4", magenta = "#c49ec4", cyan = "#9ec3c4", white = "#e7e7e7" }
